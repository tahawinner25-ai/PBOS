# One-off: builds package-lock.json on a throwaway branch and commits it back. Removed again afterwards.
name: lockfile-gen
on:
  push:
    branches: [lockfile-gen]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund --ignore-scripts
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json" || echo "nothing to commit"
          git push origin HEAD:lockfile-gen
