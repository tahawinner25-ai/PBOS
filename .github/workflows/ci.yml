name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed yet, so there is nothing for the npm cache to key on and `npm ci` cannot run.
      # Run the "Lockfile" workflow once (Actions tab) to commit package-lock.json, then switch this to `npm ci` and add `cache: npm`.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm test
      - run: npm run check:secrets
      - run: npm run check:links
      - run: npm run audit:security
      # Placeholder values are enough for `next build`; the real ones live in Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder_for_ci_build_only
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      # Reports known vulnerabilities in dependencies. Fails the job on high or critical ones.
      - run: npm audit --audit-level=high
